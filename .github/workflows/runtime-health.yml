name: Runtime Health Regression

on:
  pull_request:
  push:
    branches: [main]

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require PWA version bump for runtime changes
        if: github.event_name == 'pull_request'
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)"
          if echo "$CHANGED" | grep -Eq '(^|/).+\.js$|(^|/).+\.css$|^index\.html$|^manifest\.webmanifest$'; then
            BASE_VERSION="$(git show "$BASE_SHA:version.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")"
            CURRENT_VERSION="$(node -e "process.stdout.write(require('./version.json').version)")"
            if [ "$BASE_VERSION" = "$CURRENT_VERSION" ]; then echo "Runtime/PWA changed without version bump: still $CURRENT_VERSION"; exit 1; fi
          fi
      - name: Planner V4 syntax and behavior
        run: |
          node --check planner-engine-v4.js
          node --check runtime-stability-v4.js
          node --check sw.js
          node tests/calendar-v4-functional.test.js
          node --max-old-space-size=64 tests/planner-v4-stress.test.js
          node tests/cloud-sync-v2.test.js
          node tests/pwa-runtime-refresh.test.js
          node tests/version-bump-policy.test.js
      - name: Guard production against OOM regression
        run: |
          node <<'NODE'
          const fs=require('fs'),v=JSON.parse(fs.readFileSync('version.json','utf8')).version,index=fs.readFileSync('index.html','utf8'),engine=fs.readFileSync('planner-engine-v4.js','utf8'),sw=fs.readFileSync('sw.js','utf8');
          if(v!=='2.0.2'||!index.includes('data-build="2.0.2"'))throw new Error('Build mismatch');
          for(const a of ['planner-engine-v4.js','runtime-stability-v4.js'])if(!index.includes(a))throw new Error(`Missing ${a}`);
          for(const a of ['planner-engine-v3.js','routine.js','capacity-budget.js','scheduler-2.js','time-aware-capacity.js','schedule-authority.js'])if(index.includes(`<script src="${a}"></script>`))throw new Error(`Obsolete runtime loaded: ${a}`);
          for(const t of ['RANGE_CACHE_LIMIT=2','rangeCache','capacityCache','function cacheRange','function planWeek','calendar-v4'])if(!engine.includes(t))throw new Error(`V4 memory invariant missing: ${t}`);
          if(engine.includes('function rawCapacity')||engine.includes('function dateRange('))throw new Error('V3 explosive allocation pattern returned');
          for(const t of ["BUILD='2.0.2'","CACHE='my-performance-v2.0.2'",'planner-engine-v4.js','runtime-stability-v4.js'])if(!sw.includes(t))throw new Error(`PWA V4 missing: ${t}`);
          if(!sw.includes("key.startsWith('my-performance-')"))throw new Error('SW cache cleanup scope regression');
          console.log('Planner V4 bounded-memory architecture passed');
          NODE
