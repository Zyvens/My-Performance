name: Runtime Health Regression

on:
  pull_request:
  push:
    branches: [main]

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require PWA version bump for runtime changes
        if: github.event_name == 'pull_request'
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}";CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)";if echo "$CHANGED" | grep -Eq '(^|/).+\.js$|(^|/).+\.css$|^index\.html$|^manifest\.webmanifest$'; then BASE_VERSION="$(git show "$BASE_SHA:version.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")";CURRENT_VERSION="$(node -e "process.stdout.write(require('./version.json').version)")";if [ "$BASE_VERSION" = "$CURRENT_VERSION" ]; then echo "Runtime/PWA changed without version bump: still $CURRENT_VERSION";exit 1;fi;fi
      - name: Syntax and behavioral regression
        run: |
          for f in sp-clock-v6.js state-revision-prune-v8.js calendar-domain-v5.js calendar-revision-safety-v8.js calendar-mutation-bounded-v9.js calendar-groups-v7.js quest-audit-v6.js taxonomy-fillers-v10.js quest-milestones-v6.js quantitative-mainquests-v6.js planner-engine-v5.js planner-group-integrity-v5.js sidequest-bulk-v10.js routine-anchors-v7.js day-frame-v5.js day-frame-clock-v8.js wake-time-ui-v6.js temporal-execution-v8.js temporal-execution-ui-v8.js mission-context-v5.js routine-side-policy-v7.js fragment-progress-v6.js weekly-config-ui-v7.js interactive-week-config-v8.js sidequest-duration-v9.js filler-ui-v10.js daily-review-v6.js calendar-advanced-v5.js mainquest-grouped-config-v9.js sidequest-bulk-ui-v10.js group-root-config-v10.js retired-views-v6.js sw.js; do node --check "$f"; done
          node tests/calendar-v5-functional.test.js
          node tests/calendar-v5-routine-context.test.js
          node tests/opportunistic-sidequests.test.js
          node tests/modal-ui-v5.test.js
          node tests/calendar-v5-strategic.test.js
          node tests/quest-audit-v6.test.js
          node tests/taxonomy-fillers-v10.test.js
          node tests/sidequest-bulk-v10.test.js
          node tests/daily-review-v6.test.js
          node tests/retired-views-v6.test.js
          node tests/wake-quantity-ui-v6.test.js
          node tests/weekly-config-v7.test.js
          node tests/interactive-week-config-v8.test.js
          node tests/config-v9-regression.test.js
          node tests/group-root-v10-contract.test.js
          node tests/temporal-execution-v8.test.js
          node tests/temporal-gap-boundary-v8.test.js
          node tests/revision-wake-safety-v8.test.js
          node --max-old-space-size=64 tests/planner-v5-stress.test.js
          node tests/calendar-v5-ui-contract.test.js
          node tests/cloud-sync-v2.test.js
          node tests/pwa-runtime-refresh.test.js
          node tests/version-bump-policy.test.js
          node tests/production-runtime-contract.test.js
      - name: Guard single-Planner + Group-root architecture
        run: |
          node <<'NODE'
          const fs=require('fs'),v=JSON.parse(fs.readFileSync('version.json','utf8')).version,index=fs.readFileSync('index.html','utf8'),temporal=fs.readFileSync('temporal-execution-v8.js','utf8'),ui=fs.readFileSync('temporal-execution-ui-v8.js','utf8'),wake=fs.readFileSync('wake-time-ui-v6.js','utf8'),clock=fs.readFileSync('day-frame-clock-v8.js','utf8'),prune=fs.readFileSync('state-revision-prune-v8.js','utf8'),safe=fs.readFileSync('calendar-revision-safety-v8.js','utf8'),bounded=fs.readFileSync('calendar-mutation-bounded-v9.js','utf8'),interactive=fs.readFileSync('interactive-week-config-v8.js','utf8'),duration=fs.readFileSync('sidequest-duration-v9.js','utf8'),grouped=fs.readFileSync('mainquest-grouped-config-v9.js','utf8'),tax=fs.readFileSync('taxonomy-fillers-v10.js','utf8'),bulk=fs.readFileSync('sidequest-bulk-v10.js','utf8'),root=fs.readFileSync('group-root-config-v10.js','utf8'),sw=fs.readFileSync('sw.js','utf8');if(v!=='2.5.0'||!index.includes('data-build="2.5.0"'))throw new Error('Build mismatch');for(const a of ['state-revision-prune-v8.js','calendar-revision-safety-v8.js','calendar-mutation-bounded-v9.js','calendar-groups-v7.js','taxonomy-fillers-v10.js','sidequest-bulk-v10.js','routine-anchors-v7.js','day-frame-clock-v8.js','wake-time-ui-v6.js','routine-side-policy-v7.js','weekly-config-ui-v7.js','interactive-week-config-v8.js','sidequest-duration-v9.js','filler-ui-v10.js','mainquest-grouped-config-v9.js','sidequest-bulk-ui-v10.js','group-root-config-v10.js','temporal-execution-v8.js','temporal-execution-ui-v8.js'])if(!index.includes(a))throw new Error(`Missing ${a}`);for(const old of ['planner-engine-v4.js','calendar-ui-v3.js','routine.js','capacity-budget.js','scheduler-2.js','late-wake-policy.js','schedule-authority.js'])if(index.includes(`<script src="${old}"></script>`))throw new Error(`Obsolete runtime loaded: ${old}`);for(const t of ['Past is immutable','systemTemporalBarrier','completeMission','recordSession','skipSlot','releaseMinutes','gapOccupancy','Clock.minutesNow()'])if(!temporal.includes(t))throw new Error(`Temporal invariant missing ${t}`);for(const t of ['CONCLUÍDA','SESSÃO REGISTRADA','NÃO REALIZADA','São Paulo'])if(!ui.includes(t))throw new Error(`Temporal UI invariant missing ${t}`);for(const t of ['Replanejando…','requestAnimationFrame'])if(!wake.includes(t))throw new Error(`Wake UI invariant missing ${t}`);for(const t of ['Clock.today()','Clock.minutesNow()','America/Sao_Paulo'])if(!clock.includes(t))throw new Error(`Wake clock invariant missing ${t}`);for(const t of ['revisions=[]','decisionLog=[]'])if(!prune.includes(t))throw new Error(`Revision prune invariant missing ${t}`);for(const t of ['D.recordRevision=function','cleanCalendar','MAX_REVISIONS=20'])if(!safe.includes(t))throw new Error(`Revision safety invariant missing ${t}`);for(const t of ['c.revisions=[]','previous','newOnes','MAX_REVISIONS'])if(!bounded.includes(t))throw new Error(`Bounded mutation invariant missing ${t}`);for(const t of ['removeLegacyWindowList','openWindow','openAnchor','Janelas ativadas','Janelas desativadas','data-sq-left','data-sq-right'])if(!interactive.includes(t))throw new Error(`Interactive config invariant missing ${t}`);for(const t of ['Duração fixa (min)','Esforço total no período (min)','delete m.flexMinMin'])if(!duration.includes(t))throw new Error(`Duration invariant missing ${t}`);for(const t of ['mq-group-v9','ordenadas por deadline','due(a).localeCompare(due(b))'])if(!grouped.includes(t))throw new Error(`Main Quest grouping invariant missing ${t}`);for(const t of ['Group -> Campaign -> Main Quest','Group -> Filler -> Side Quest','B.groupForQuest=function','D.addFiller','B.updateCampaign'])if(!tax.includes(t))throw new Error(`Taxonomy invariant missing ${t}`);for(const t of ['transaction(reason','D.recordRevision(reason)','saveState()','E?.invalidate','PRESETS'])if(!bulk.includes(t))throw new Error(`Bulk invariant missing ${t}`);for(const t of ['ARQUITETURA DOS GRUPOS','Selecionar Side Quests','Editar em bloco','+ Filler','hideLegacy'])if(!root.includes(t))throw new Error(`Group-root UI invariant missing ${t}`);for(const t of ["BUILD='2.5.0'","CACHE='my-performance-v2.5.0'",'taxonomy-fillers-v10.js','sidequest-bulk-v10.js','filler-ui-v10.js','sidequest-bulk-ui-v10.js','group-root-config-v10.js','group-root-v10.css'])if(!sw.includes(t))throw new Error(`PWA asset missing ${t}`);console.log('My Performance 2.5.0 Group-root Campaign/Filler architecture passed');
          NODE
