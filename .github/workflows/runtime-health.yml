name: Runtime Health Regression

on:
  pull_request:
  push:
    branches: [main]

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require PWA version bump for runtime changes
        if: github.event_name == 'pull_request'
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)"
          if echo "$CHANGED" | grep -Eq '(^|/).+\.js$|(^|/).+\.css$|^index\.html$|^manifest\.webmanifest$'; then
            BASE_VERSION="$(git show "$BASE_SHA:version.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")"
            CURRENT_VERSION="$(node -e "process.stdout.write(require('./version.json').version)")"
            if [ "$BASE_VERSION" = "$CURRENT_VERSION" ]; then
              echo "Runtime/PWA changed without version bump: still $CURRENT_VERSION"
              exit 1
            fi
          fi
      - name: Syntax and focused runtime tests
        run: |
          node --check weekly-schedule-v2.js
          node --check cloud-sync-v2.js
          node --check recalc-center-fix.js
          node --check runtime-health.js
          node --check pwa-update.js
          node --check completion-guard.js
          node --check discard-day.js
          node --check sw.js
          node tests/weekly-schedule-v2.test.js
          node tests/cloud-sync-v2.test.js
          node tests/adaptive-fairness.test.js
          node tests/discard-day.test.js
          node tests/pwa-runtime-refresh.test.js
          node tests/version-bump-policy.test.js
      - name: Guard final runtime composition
        run: |
          node <<'NODE'
          const fs=require('fs');
          const index=fs.readFileSync('index.html','utf8');
          for(const token of ['data-build="1.5.21"','cloud-sync-v2.js','weekly-schedule-v2.js','completion-guard.js','schedule-authority.js'])if(!index.includes(token))throw new Error(`HTML runtime marker missing: ${token}`);
          if(index.includes('<script src="cloud-sync.js"></script>'))throw new Error('Legacy cloud sync must not load');
          if(index.includes('<script src="muay-optional.js"></script>'))throw new Error('Muay engine must not load');
          if(index.lastIndexOf('weekly-schedule-v2.js')<index.lastIndexOf('schedule-authority.js'))throw new Error('Weekly Schedule V2 must load last');
          const weekly=fs.readFileSync('weekly-schedule-v2.js','utf8');
          for(const token of ["delete state.routineSettings.gymStart","delete state.routineSettings.muayDays","g.title='Academia — Perna'","add(p,g,720,810","add(p,sh,810,840","personal-therapy-weekly","STUDY_MIN=180","renderToday=renderTodayV2"])if(!weekly.includes(token))throw new Error(`Final schedule invariant missing: ${token}`);
          if(weekly.includes('BASE_RENDER_TODAY()'))throw new Error('Final renderer must not invoke the legacy Today renderer');
          const cloud=fs.readFileSync('cloud-sync-v2.js','utf8');
          for(const token of ["SDK_VERSION='0.6.2-beta'",'client.auth.signIn.email','client.auth.signUp.email','my_performance_pull','my_performance_push'])if(!cloud.includes(token))throw new Error(`Neon sync invariant missing: ${token}`);
          if(cloud.includes('0.6.3-beta'))throw new Error('Unpublished Neon SDK version reintroduced');
          const health=fs.readFileSync('runtime-health.js','utf8');if(!health.includes("dataset.build||'1.5.21'"))throw new Error('Runtime badge version mismatch');
          const sw=fs.readFileSync('sw.js','utf8');for(const token of ["BUILD='1.5.21'","CACHE='my-performance-v1.5.21'",'cloud-sync-v2.js','weekly-schedule-v2.js','client.navigate','_mpv'])if(!sw.includes(token))throw new Error(`PWA build incomplete: ${token}`);
          if(!sw.includes("key.startsWith('my-performance-')"))throw new Error('Service worker must only delete My Performance caches');
          const version=JSON.parse(fs.readFileSync('version.json','utf8'));if(version.version!=='1.5.21')throw new Error('Server version beacon mismatch');
          console.log('v1.5.21 final runtime composition passed');
          NODE
