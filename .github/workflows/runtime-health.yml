name: Runtime Health Regression

on:
  pull_request:
  push:
    branches: [main]

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require PWA version bump for runtime changes
        if: github.event_name == 'pull_request'
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}";CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)";if echo "$CHANGED" | grep -Eq '(^|/).+\.js$|(^|/).+\.css$|^index\.html$|^manifest\.webmanifest$'; then BASE_VERSION="$(git show "$BASE_SHA:version.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")";CURRENT_VERSION="$(node -e "process.stdout.write(require('./version.json').version)")";if [ "$BASE_VERSION" = "$CURRENT_VERSION" ]; then echo "Runtime/PWA changed without version bump: still $CURRENT_VERSION";exit 1;fi;fi
      - name: Planner V5 syntax and behavior
        run: |
          node --check calendar-model-fastpath-v4.js
          node --check calendar-domain-v5.js
          node --check calendar-persistence-v5.js
          node --check calendar-planner-policy-v5.js
          node --check planner-dependency-v5.js
          node --check sidequest-quality-v5.js
          node --check planner-engine-v5.js
          node --check opportunistic-sidequests-v5.js
          node --check calendar-actions-v5.js
          node --check calendar-ui-v5.js
          node --check calendar-advanced-v5.js
          node --check calendar-dragdrop-v5.js
          node --check calendar-strategic-v5.js
          node --check runtime-stability-v5.js
          node --check sw.js
          node tests/calendar-v5-functional.test.js
          node tests/opportunistic-sidequests.test.js
          node tests/calendar-v5-strategic.test.js
          node --max-old-space-size=64 tests/planner-v5-stress.test.js
          node tests/calendar-v5-ui-contract.test.js
          node tests/cloud-sync-v2.test.js
          node tests/pwa-runtime-refresh.test.js
          node tests/version-bump-policy.test.js
          node tests/production-runtime-contract.test.js
      - name: Guard opportunistic single-Planner architecture
        run: |
          node <<'NODE'
          const fs=require('fs'),v=JSON.parse(fs.readFileSync('version.json','utf8')).version,index=fs.readFileSync('index.html','utf8'),quality=fs.readFileSync('sidequest-quality-v5.js','utf8'),engine=fs.readFileSync('planner-engine-v5.js','utf8'),opp=fs.readFileSync('opportunistic-sidequests-v5.js','utf8'),sw=fs.readFileSync('sw.js','utf8');if(v!=='2.1.3'||!index.includes('data-build="2.1.3"'))throw new Error('Build mismatch');for(const a of ['sidequest-quality-v5.js','planner-engine-v5.js','opportunistic-sidequests-v5.js'])if(!index.includes(a))throw new Error(`Missing ${a}`);if(index.indexOf('sidequest-quality-v5.js')>index.indexOf('planner-engine-v5.js'))throw new Error('Quality policy order regression');if(index.indexOf('planner-engine-v5.js')>index.indexOf('opportunistic-sidequests-v5.js'))throw new Error('Opportunistic adapter order regression');for(const a of ['planner-engine-v4.js','calendar-ui-v3.js','runtime-stability-v4.js','routine.js','capacity-budget.js','scheduler-2.js','time-aware-capacity.js','schedule-authority.js'])if(index.includes(`<script src="${a}"></script>`))throw new Error(`Obsolete runtime loaded: ${a}`);for(const t of ['opportunistic-v1','isOpportunistic','return-900','rigidity===\'free\''])if(!quality.includes(t))throw new Error(`Opportunistic quality invariant missing: ${t}`);for(const t of ['RANGE_CACHE_LIMIT=2','rangeCache','dayCapCache',"p.engine='calendar-v5'",'SQ.scoreBonus'])if(!engine.includes(t))throw new Error(`Planner invariant missing: ${t}`);for(const t of ['autoIgnored','outsideCalendar:visible','Side Quest oportunística sem espaço'])if(!opp.includes(t))throw new Error(`Opportunistic adapter missing: ${t}`);for(const t of ["BUILD='2.1.3'","CACHE='my-performance-v2.1.3'",'sidequest-quality-v5.js','opportunistic-sidequests-v5.js'])if(!sw.includes(t))throw new Error(`PWA opportunistic asset missing: ${t}`);if(!sw.includes("key.startsWith('my-performance-')"))throw new Error('SW cache cleanup scope regression');console.log('Opportunistic Calendar V5 2.1.3 architecture passed');
          NODE
