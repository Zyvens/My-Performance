name: Runtime Health Regression

on:
  pull_request:
  push:
    branches: [main]

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and scheduler tests
        run: |
          node --check recalc-center-fix.js
          node --check runtime-health.js
          node --check pwa-update.js
          node --check time-aware-capacity.js
          node --check late-wake-policy.js
          node --check funding-strategy-2026.js
          node --check completion-guard.js
          node --check sw.js
          node tests/scheduler2.test.js
          node tests/live-capacity.test.js
          node tests/time-aware-core.test.js
          node tests/late-wake-policy.test.js
          node tests/funding-strategy-2026.test.js
      - name: Guard against known runtime regressions
        run: |
          node <<'NODE'
          const fs=require('fs');
          const recalc=fs.readFileSync('recalc-center-fix.js','utf8');
          if(recalc.includes("const observer=new MutationObserver(()=>bind())"))throw new Error('Regression: recursive MutationObserver');
          if(!recalc.includes("if(btn.textContent!==label)btn.textContent='↻ Recalcular / Diagnóstico'"))throw new Error('Recalc binding must be idempotent');
          const index=fs.readFileSync('index.html','utf8');
          if(!index.includes('data-build="1.5.11"')||!index.includes('completion-guard.js'))throw new Error('HTML completion build marker missing');
          const health=fs.readFileSync('runtime-health.js','utf8');
          if(!health.includes("document.documentElement.dataset.build||'1.5.11'"))throw new Error('Runtime badge must read shell build');
          const update=fs.readFileSync('pwa-update.js','utf8');
          if(update.includes("LOCAL_BUILD='1.5.7'")||update.includes('const LOCAL_BUILD='))throw new Error('PWA updater must not hardcode stale local build');
          for(const token of ['clientBuild','waitForWaiting','controllerchange','cacheBust'])if(!update.includes(token))throw new Error(`Atomic PWA update missing: ${token}`);
          const completion=fs.readFileSync('completion-guard.js','utf8');
          for(const token of ["document.addEventListener('click'",'[data-toggle]','stopImmediatePropagation','toggleQuest(id,date)'])if(!completion.includes(token))throw new Error(`Completion guard missing: ${token}`);
          const sw=fs.readFileSync('sw.js','utf8');
          if(!sw.includes("my-performance-v1.5.11")||!sw.includes('completion-guard.js'))throw new Error('PWA completion build incomplete');
          const version=JSON.parse(fs.readFileSync('version.json','utf8'));
          if(version.version!=='1.5.11')throw new Error('Server version beacon mismatch');
          console.log('Runtime, PWA and completion guards passed');
          NODE
