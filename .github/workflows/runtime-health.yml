name: Runtime Health Regression

on:
  pull_request:
  push:
    branches: [main]

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and scheduler tests
        run: |
          node --check recalc-center-fix.js
          node --check runtime-health.js
          node --check pwa-update.js
          node --check time-aware-capacity.js
          node --check late-wake-policy.js
          node --check funding-strategy-2026.js
          node --check post-funding-rebalance.js
          node --check completion-guard.js
          node --check discard-day.js
          node --check fixed-commitments.js
          node --check adaptive-fairness.js
          node --check balanced-capacity.js
          node --check sw.js
          node tests/scheduler2.test.js
          node tests/live-capacity.test.js
          node tests/time-aware-core.test.js
          node tests/late-wake-policy.test.js
          node tests/funding-strategy-2026.test.js
          node tests/discard-day.test.js
          node tests/fixed-commitments.test.js
          node tests/adaptive-fairness.test.js
          node tests/balanced-capacity.test.js
      - name: Guard against known runtime regressions
        run: |
          node <<'NODE'
          const fs=require('fs');
          const recalc=fs.readFileSync('recalc-center-fix.js','utf8');
          if(recalc.includes("const observer=new MutationObserver(()=>bind())"))throw new Error('Regression: recursive MutationObserver');
          const index=fs.readFileSync('index.html','utf8');
          for(const token of ['data-build="1.5.16"','completion-guard.js','discard-day.js','fixed-commitments.js','adaptive-fairness.js','balanced-capacity.js','post-funding-rebalance.js'])if(!index.includes(token))throw new Error(`HTML scheduler marker missing: ${token}`);
          const health=fs.readFileSync('runtime-health.js','utf8');
          if(!health.includes("document.documentElement.dataset.build||'1.5.16'"))throw new Error('Runtime badge must read shell build');
          const completion=fs.readFileSync('completion-guard.js','utf8');
          for(const token of ['markManual','recordCompletion','unlockChecks','[data-toggle][disabled]','dependencyStatus(q).missing'])if(!completion.includes(token))throw new Error(`Manual completion authority missing: ${token}`);
          if(completion.includes("toast('Quest bloqueada por dependência')"))throw new Error('Manual completion must never be blocked by dependencies');
          const discard=fs.readFileSync('discard-day.js','utf8');
          for(const token of ['Descartar dia','discardedDays','pendingRelevant','deferAdaptive','rescheduledFromDiscard','completedQuestIds'])if(!discard.includes(token))throw new Error(`Discard day behavior missing: ${token}`);
          const fixed=fs.readFileSync('fixed-commitments.js','utf8');
          for(const token of ["title:'Terapia'","weekdays:[2]","timeStart:'08:00'","timeEnd:'08:30'","commuteOutMin:60","commuteReturnMin:60"])if(!fixed.includes(token))throw new Error(`Tuesday therapy commitment missing: ${token}`);
          const fairness=fs.readFileSync('adaptive-fairness.js','utf8');
          for(const token of ['Hard rule: NEVER reuse parentId+date','hardDedup:true','fairnessLate','Adaptive fairness invariant violated'])if(!fairness.includes(token))throw new Error(`Adaptive hard dedup missing: ${token}`);
          const postFunding=fs.readFileSync('post-funding-rebalance.js','utf8');
          for(const token of ['funding-strategy-postpass','MyPerformanceAdaptive.recalculate','MyPerformanceAdaptiveFairness'])if(!postFunding.includes(token))throw new Error(`Post-funding recalculation missing: ${token}`);
          const balance=fs.readFileSync('balanced-capacity.js','utf8');
          for(const token of ['STUDY_MIN=90','GSA_SOFT_TARGET=480','capacityStudyProtected','meta flexível'])if(!balance.includes(token))throw new Error(`Balanced capacity missing: ${token}`);
          const sw=fs.readFileSync('sw.js','utf8');
          for(const token of ['my-performance-v1.5.16','fixed-commitments.js','adaptive-fairness.js','balanced-capacity.js','post-funding-rebalance.js'])if(!sw.includes(token))throw new Error(`PWA scheduler build incomplete: ${token}`);
          const version=JSON.parse(fs.readFileSync('version.json','utf8'));
          if(version.version!=='1.5.16')throw new Error('Server version beacon mismatch');
          console.log('Runtime, PWA, balanced scheduling and Avançar hard dedup guards passed');
          NODE
