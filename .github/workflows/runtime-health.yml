name: Runtime Health Regression

on:
  pull_request:
  push:
    branches: [main]

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require PWA version bump for runtime changes
        if: github.event_name == 'pull_request'
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}";CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)";if echo "$CHANGED" | grep -Eq '(^|/).+\.js$|(^|/).+\.css$|^index\.html$|^manifest\.webmanifest$'; then BASE_VERSION="$(git show "$BASE_SHA:version.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")";CURRENT_VERSION="$(node -e "process.stdout.write(require('./version.json').version)")";if [ "$BASE_VERSION" = "$CURRENT_VERSION" ]; then echo "Runtime/PWA changed without version bump: still $CURRENT_VERSION";exit 1;fi;fi
      - name: Syntax and behavioral regression
        run: |
          for f in sp-clock-v6.js quest-audit-v6.js quest-milestones-v6.js planner-engine-v5.js planner-group-integrity-v5.js day-frame-v5.js mission-context-v5.js daily-review-v6.js sw.js; do node --check "$f"; done
          node tests/calendar-v5-functional.test.js
          node tests/calendar-v5-routine-context.test.js
          node tests/opportunistic-sidequests.test.js
          node tests/modal-ui-v5.test.js
          node tests/calendar-v5-strategic.test.js
          node tests/quest-audit-v6.test.js
          node tests/daily-review-v6.test.js
          node --max-old-space-size=64 tests/planner-v5-stress.test.js
          node tests/calendar-v5-ui-contract.test.js
          node tests/cloud-sync-v2.test.js
          node tests/pwa-runtime-refresh.test.js
          node tests/version-bump-policy.test.js
          node tests/production-runtime-contract.test.js
      - name: Guard single-Planner + Sao Paulo rollover architecture
        run: |
          node <<'NODE'
          const fs=require('fs'),v=JSON.parse(fs.readFileSync('version.json','utf8')).version,index=fs.readFileSync('index.html','utf8'),clock=fs.readFileSync('sp-clock-v6.js','utf8'),audit=fs.readFileSync('quest-audit-v6.js','utf8'),review=fs.readFileSync('daily-review-v6.js','utf8'),sw=fs.readFileSync('sw.js','utf8');if(v!=='2.3.0'||!index.includes('data-build="2.3.0"'))throw new Error('Build mismatch');for(const a of ['sp-clock-v6.js','quest-audit-v6.js','quest-milestones-v6.js','planner-engine-v5.js','planner-group-integrity-v5.js','day-frame-v5.js','calendar-ui-v5.js','mission-context-v5.js','daily-review-v6.js'])if(!index.includes(a))throw new Error(`Missing ${a}`);for(const old of ['planner-engine-v4.js','calendar-ui-v3.js','routine.js','capacity-budget.js','scheduler-2.js','late-wake-policy.js','schedule-authority.js'])if(index.includes(`<script src="${old}"></script>`))throw new Error(`Obsolete runtime loaded: ${old}`);for(const t of ['America/Sao_Paulo','todaySP','minutesNow'])if(!clock.includes(t))throw new Error(`Clock invariant missing ${t}`);for(const t of ['campaign-transpetro-2026','campaign-gsa-operacao-2026','pack-study-practice','pack-professional-development','pack-gsa-cadence'])if(!audit.includes(t))throw new Error(`Audit invariant missing ${t}`);for(const t of ['reviewedThroughDate','Tarefas passadas / atrasadas','Revisar cronograma','EM ATRASO','carryoverMain','reviewGate'])if(!review.includes(t))throw new Error(`Daily review invariant missing ${t}`);for(const t of ["BUILD='2.3.0'","CACHE='my-performance-v2.3.0'",'sp-clock-v6.js','quest-audit-v6.js','daily-review-v6.js','daily-review-v6.css'])if(!sw.includes(t))throw new Error(`PWA asset missing ${t}`);console.log('My Performance 2.3.0 rollover architecture passed');
          NODE
