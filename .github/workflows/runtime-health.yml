name: Runtime Health Regression

on:
  pull_request:
  push:
    branches: [main]

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require PWA version bump for runtime changes
        if: github.event_name == 'pull_request'
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}";CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)";if echo "$CHANGED" | grep -Eq '(^|/).+\.js$|(^|/).+\.css$|^index\.html$|^manifest\.webmanifest$'; then BASE_VERSION="$(git show "$BASE_SHA:version.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")";CURRENT_VERSION="$(node -e "process.stdout.write(require('./version.json').version)")";if [ "$BASE_VERSION" = "$CURRENT_VERSION" ]; then echo "Runtime/PWA changed without version bump: still $CURRENT_VERSION";exit 1;fi;fi
      - name: Syntax and behavioral regression
        run: |
          for f in sp-clock-v6.js state-revision-prune-v8.js calendar-domain-v5.js calendar-revision-safety-v8.js calendar-mutation-bounded-v9.js calendar-groups-v7.js quest-audit-v6.js taxonomy-fillers-v10.js quest-milestones-v6.js quantitative-mainquests-v6.js planner-engine-v5.js planner-group-integrity-v5.js sidequest-priority-v11.js sidequest-bulk-v10.js routine-anchors-v7.js day-frame-v5.js day-frame-clock-v8.js wake-time-ui-v6.js temporal-execution-v8.js temporal-consistency-v11.js temporal-execution-ui-v8.js mission-context-v5.js routine-side-policy-v7.js fragment-progress-v6.js weekly-config-ui-v7.js interactive-week-config-v8.js sidequest-duration-v9.js filler-ui-v10.js daily-review-v6.js calendar-advanced-v5.js mainquest-grouped-config-v9.js sidequest-bulk-ui-v10.js group-root-config-v10.js group-root-extras-v10.js sidequest-priority-ui-v11.js window-authority-v11.js calendar-timeline-v11.js retired-views-v6.js boot-ready-v11.js sw.js; do node --check "$f"; done
          node tests/temporal-consistency-v11.test.js
          node tests/window-authority-v11.test.js
          node tests/sidequest-priority-v11.test.js
          node tests/planner-consistency-v11-contract.test.js
          node tests/calendar-v5-functional.test.js
          node tests/calendar-v5-routine-context.test.js
          node tests/opportunistic-sidequests.test.js
          node tests/modal-ui-v5.test.js
          node tests/calendar-v5-strategic.test.js
          node tests/quest-audit-v6.test.js
          node tests/taxonomy-fillers-v10.test.js
          node tests/sidequest-bulk-v10.test.js
          node tests/daily-review-v6.test.js
          node tests/retired-views-v6.test.js
          node tests/wake-quantity-ui-v6.test.js
          node tests/weekly-config-v7.test.js
          node tests/interactive-week-config-v8.test.js
          node tests/config-v9-regression.test.js
          node tests/group-root-v10-contract.test.js
          node tests/temporal-execution-v8.test.js
          node tests/temporal-gap-boundary-v8.test.js
          node tests/revision-wake-safety-v8.test.js
          node tests/boot-fail-open-v12.test.js
          node --max-old-space-size=64 tests/planner-v5-stress.test.js
          node tests/calendar-v5-ui-contract.test.js
          node tests/cloud-sync-v2.test.js
          node tests/pwa-runtime-refresh.test.js
          node tests/version-bump-policy.test.js
          node tests/production-runtime-contract.test.js
      - name: Guard single-Planner + fail-open boot architecture
        run: |
          node <<'NODE'
          const fs=require('fs'),v=JSON.parse(fs.readFileSync('version.json','utf8')).version,index=fs.readFileSync('index.html','utf8'),boot=fs.readFileSync('boot-ready-v11.js','utf8'),css=fs.readFileSync('boot-ready-v11.css','utf8'),sw=fs.readFileSync('sw.js','utf8');if(!index.includes(`data-build="${v}"`))throw new Error('Build mismatch');for(const old of ['planner-engine-v4.js','calendar-ui-v3.js','routine.js','capacity-budget.js','scheduler-2.js','late-wake-policy.js','schedule-authority.js','calendar-dragdrop-v5.js'])if(index.includes(`<script src="${old}"></script>`))throw new Error(`Obsolete runtime loaded: ${old}`);if(index.lastIndexOf('boot-ready-v11.js')<index.lastIndexOf('runtime-stability-v5.js'))throw new Error('Boot gate not last');for(const t of ['WATCHDOG_MS',"reveal('rendering')",'setTimeout','my-performance-boot-error'])if(!boot.includes(t))throw new Error(`Boot invariant missing ${t}`);if(!css.includes('mp-planner-buffer')||!css.includes('@keyframes'))throw new Error('Buffering animation missing');for(const t of [`BUILD='${v}'`,`CACHE='my-performance-v${v}'`,'boot-ready-v11.js'])if(!sw.includes(t))throw new Error(`PWA asset missing ${t}`);console.log(`My Performance ${v} single-Planner + fail-open boot architecture passed`);
          NODE
