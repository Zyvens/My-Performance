name: Validate My Performance

on:
  pull_request:
  push:
    branches: [agent/life-rpg, agent/notifications-routine, agent/muay-optional, agent/adaptive-life-engine, agent/day-skip-daily-balance, agent/weekend-protection]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check data.js
          node --check routine-data.js
          node --check app.js
          node --check cloud-sync.js
          node --check planner.js
          node --check routine.js
          node --check muay-optional.js
          node --check adaptive-engine.js
          node --check runtime-hooks.js
          node --check notifications.js
          node --check narrator.js
          node --check day-controls.js
          node --check weekend-protection.js
          node --check sw.js
      - name: Validate quest catalog
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const ctx={console};vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('data.js','utf8'),ctx);
          vm.runInContext(fs.readFileSync('routine-data.js','utf8'),ctx);
          const qs=ctx.QUEST_SEED;
          if(!Array.isArray(qs)||qs.length<120)throw new Error(`Expected >=120 quests after routine layer, got ${qs?.length}`);
          const ids=new Set();
          for(const q of qs){
            if(!q.id||!q.title)throw new Error('Quest without id/title');
            if(ids.has(q.id))throw new Error(`Duplicate quest id: ${q.id}`);
            ids.add(q.id);
          }
          const broken=[];
          for(const q of qs)for(const d of q.dependencies||[])if(!ids.has(d))broken.push(`${q.id} -> ${d}`);
          if(broken.length)throw new Error(`Broken dependencies: ${broken.join(', ')}`);
          const counts=qs.reduce((o,q)=>(o[q.domain]=(o[q.domain]||0)+1,o),{});
          const required=['routine-water-am','routine-muay','routine-gsa-focus-pm','routine-hygiene-night'];
          for(const id of required)if(!ids.has(id))throw new Error(`Missing routine quest: ${id}`);
          if(!fs.readFileSync('adaptive-engine.js','utf8').includes("SYSTEM_START='2026-08-10'"))throw new Error('Adaptive engine must start on 2026-08-10');
          if(!fs.readFileSync('narrator.js','utf8').includes('speechSynthesis'))throw new Error('Narrator speech engine missing');
          const day=fs.readFileSync('day-controls.js','utf8');
          if(!day.includes("GSA:{title:'GSA — avanço mínimo diário'"))throw new Error('Daily GSA minimum missing');
          if(!day.includes("Estudos:{title:'Estudos — sessão mínima diária'"))throw new Error('Daily study minimum missing');
          if(!day.includes('EXTRA_MIN=120')||!day.includes('MIN_SLEEP_HOURS=6'))throw new Error('Emergency day rules missing');
          const week=fs.readFileSync('weekend-protection.js','utf8');
          if(!week.includes("Sexta encerra às 18:00"))throw new Error('Friday cutoff missing');
          if(!week.includes("Sábado encerra às 12:00"))throw new Error('Saturday cutoff missing');
          if(!week.includes("Domingo protegido: sem cronograma"))throw new Error('Sunday protection missing');
          console.log(`Validated ${qs.length} quests`,counts);
          NODE
