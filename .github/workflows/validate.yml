name: Validate My Performance

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check production JavaScript syntax
        run: |
          node --check data.js
          node --check routine-data.js
          node --check app.js
          node --check scheduler-core.js
          node --check planner.js
          node --check calendar-model-v3.js
          node --check campaign-policy-v3.js
          node --check calendar-model-fastpath-v4.js
          node --check planner-engine-v4.js
          node --check calendar-runtime-v3.js
          node --check cloud-sync-v2.js
          node --check notifications.js
          node --check pwa-update.js
          node --check calendar-ui-v3.js
          node --check runtime-stability-v4.js
          node --check sw.js
      - name: Calendar V4 functional regression
        run: node tests/calendar-v4-functional.test.js
      - name: Planner V4 bounded memory and zero-write regression
        run: node --max-old-space-size=64 tests/planner-v4-stress.test.js
      - name: Cloud and PWA regressions
        run: |
          node tests/cloud-sync-v2.test.js
          node tests/pwa-runtime-refresh.test.js
          node tests/version-bump-policy.test.js
          node tests/production-runtime-contract.test.js
      - name: Validate production composition
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');const ctx={console};vm.createContext(ctx);vm.runInContext(fs.readFileSync('data.js','utf8'),ctx);vm.runInContext(fs.readFileSync('routine-data.js','utf8'),ctx);const qs=ctx.QUEST_SEED;if(!Array.isArray(qs)||qs.length<120)throw new Error(`Expected >=120 seed missions, got ${qs?.length}`);const ids=new Set();for(const q of qs){if(!q.id||!q.title)throw new Error('Mission without id/title');if(ids.has(q.id))throw new Error(`Duplicate mission id: ${q.id}`);ids.add(q.id)}
          const index=fs.readFileSync('index.html','utf8');for(const asset of ['calendar-model-v3.js','campaign-policy-v3.js','calendar-model-fastpath-v4.js','planner-engine-v4.js','calendar-runtime-v3.js','cloud-sync-v2.js','notifications.js','pwa-update.js','calendar-ui-v3.js','runtime-stability-v4.js'])if(!index.includes(`<script src="${asset}"></script>`))throw new Error(`Production asset missing: ${asset}`);if(index.indexOf('calendar-model-fastpath-v4.js')>index.indexOf('planner-engine-v4.js'))throw new Error('Calendar fast path must load before Planner V4');for(const asset of ['planner-engine-v3.js','routine.js','muay-optional.js','capacity-budget.js','scheduler-2.js','time-aware-capacity.js','late-wake-policy.js','schedule-authority.js','weekly-schedule-v2.js'])if(index.includes(`<script src="${asset}"></script>`))throw new Error(`Obsolete scheduler loaded: ${asset}`);
          const fast=fs.readFileSync('calendar-model-fastpath-v4.js','utf8'),engine=fs.readFileSync('planner-engine-v4.js','utf8');for(const token of ['fastModel','M.groupForQuest=function','M.campaignForQuest=function','M.fastPath=true'])if(!fast.includes(token))throw new Error(`Fast model invariant missing: ${token}`);for(const token of ['RANGE_CACHE_LIMIT=2','capacityCache','function cacheRange','function planWeek','calendar-v4','metrics'])if(!engine.includes(token))throw new Error(`Planner V4 invariant missing: ${token}`);if(engine.includes('function rawCapacity')||engine.includes('function dateRange('))throw new Error('Explosive V3 capacity/date allocation pattern reintroduced');const v=JSON.parse(fs.readFileSync('version.json','utf8'));if(v.version!=='2.0.2')throw new Error(`Expected 2.0.2, got ${v.version}`);console.log(`Validated ${qs.length} missions and bounded-memory/zero-write ${v.version} runtime`);
          NODE
