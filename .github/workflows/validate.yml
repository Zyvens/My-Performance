name: Validate My Performance

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check production JavaScript syntax
        run: |
          for f in preboot-compact-v12.js data.js routine-data.js app.js sp-clock-v6.js scheduler-core.js planner.js calendar-model-v3.js campaign-policy-v3.js calendar-model-fastpath-v4.js state-revision-prune-v8.js calendar-domain-v5.js calendar-revision-safety-v8.js calendar-mutation-bounded-v9.js calendar-groups-v7.js quest-audit-v6.js taxonomy-fillers-v10.js quest-milestones-v6.js quantitative-mainquests-v6.js calendar-persistence-v5.js calendar-planner-policy-v5.js planner-dependency-v5.js sidequest-quality-v5.js planner-engine-v5.js planner-group-integrity-v5.js sidequest-priority-v11.js sidequest-bulk-v10.js routine-anchors-v7.js day-frame-v5.js day-frame-clock-v8.js wake-time-ui-v6.js opportunistic-sidequests-v5.js calendar-actions-v5.js calendar-runtime-v3.js cloud-sync-v2.js notifications.js pwa-update.js calendar-ui-v5.js temporal-execution-v8.js temporal-consistency-v11.js temporal-execution-ui-v8.js modal-ui-fix-v5.js mission-context-v5.js routine-side-policy-v7.js fragment-progress-v6.js weekly-config-ui-v7.js interactive-week-config-v8.js sidequest-duration-v9.js filler-ui-v10.js daily-review-v6.js calendar-advanced-v5.js mainquest-grouped-config-v9.js sidequest-bulk-ui-v10.js group-root-config-v10.js group-root-extras-v10.js sidequest-priority-ui-v11.js window-authority-v11.js calendar-timeline-v11.js calendar-strategic-v5.js retired-views-v6.js runtime-stability-v5.js boot-ready-v11.js sw.js; do node --check "$f"; done
      - name: Planner consistency regressions
        run: |
          node tests/preboot-compact-v12.test.js
          node tests/temporal-consistency-v11.test.js
          node tests/window-authority-v11.test.js
          node tests/sidequest-priority-v11.test.js
          node tests/planner-consistency-v11-contract.test.js
          node tests/taxonomy-fillers-v10.test.js
          node tests/sidequest-bulk-v10.test.js
          node tests/group-root-v10-contract.test.js
      - name: Calendar functional regressions
        run: |
          node tests/calendar-v5-functional.test.js
          node tests/calendar-v5-routine-context.test.js
          node tests/opportunistic-sidequests.test.js
          node tests/modal-ui-v5.test.js
          node tests/calendar-v5-strategic.test.js
          node tests/quest-audit-v6.test.js
          node tests/daily-review-v6.test.js
          node tests/retired-views-v6.test.js
          node tests/wake-quantity-ui-v6.test.js
          node tests/weekly-config-v7.test.js
          node tests/interactive-week-config-v8.test.js
          node tests/config-v9-regression.test.js
          node tests/temporal-execution-v8.test.js
          node tests/temporal-gap-boundary-v8.test.js
          node tests/revision-wake-safety-v8.test.js
          node tests/boot-fail-open-v12.test.js
      - name: Planner bounded-memory regression
        run: node --max-old-space-size=64 tests/planner-v5-stress.test.js
      - name: UI, cloud, PWA and production contracts
        run: |
          node tests/calendar-v5-ui-contract.test.js
          node tests/cloud-sync-v2.test.js
          node tests/pwa-runtime-refresh.test.js
          node tests/version-bump-policy.test.js
          node tests/production-runtime-contract.test.js
      - name: Validate catalog and runtime composition
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');const ctx={console};vm.createContext(ctx);vm.runInContext(fs.readFileSync('data.js','utf8'),ctx);vm.runInContext(fs.readFileSync('routine-data.js','utf8'),ctx);const qs=ctx.QUEST_SEED;if(!Array.isArray(qs)||qs.length<120)throw new Error(`Expected >=120 seed missions, got ${qs?.length}`);const ids=new Set();for(const q of qs){if(!q.id||!q.title)throw new Error('Mission without id/title');if(ids.has(q.id))throw new Error(`Duplicate mission id: ${q.id}`);ids.add(q.id)}
          const index=fs.readFileSync('index.html','utf8'),v=JSON.parse(fs.readFileSync('version.json','utf8')),sw=fs.readFileSync('sw.js','utf8'),boot=fs.readFileSync('boot-ready-v11.js','utf8'),bootCss=fs.readFileSync('boot-ready-v11.css','utf8'),pre=fs.readFileSync('preboot-compact-v12.js','utf8'),temporal=fs.readFileSync('temporal-consistency-v11.js','utf8'),review=fs.readFileSync('daily-review-v6.js','utf8'),cloud=fs.readFileSync('cloud-sync-v2.js','utf8');if(!index.includes(`data-build="${v.version}"`))throw new Error('index/version mismatch');if(!sw.includes(`BUILD='${v.version}'`)||!sw.includes(`CACHE='my-performance-v${v.version}'`))throw new Error('PWA/version mismatch');if(index.indexOf('preboot-compact-v12.js')>index.indexOf('app.js'))throw new Error('preboot compaction must run before app state load');if(index.lastIndexOf('boot-ready-v11.js')<index.lastIndexOf('runtime-stability-v5.js'))throw new Error('Boot gate must load after runtime composition');for(const t of ['WATCHDOG_MS',"reveal('rendering')",'forceToday','my-performance-boot-error'])if(!boot.includes(t))throw new Error(`Hot-today boot invariant missing ${t}`);if(!bootCss.includes('@keyframes mp-planner-buffer')||!bootCss.includes('#calPrev,#calNext'))throw new Error('Today-only loading UI missing');if(!pre.includes('my_performance_neon_base_snapshot')||!pre.includes('slice(-80)'))throw new Error('Preboot compaction missing');if(!temporal.includes('plannerSkipped')||!temporal.includes('lightPast'))throw new Error('Past Planner skip missing');if(!review.includes('KEEP_SNAPSHOTS=3')||!review.includes('scheduleSnapshot(2500)'))throw new Error('Light backlog missing');if(!cloud.includes("baseMode:'signature'")||!cloud.includes('plannerDate=todaySafe()'))throw new Error('Compact cloud/today sanitization missing');console.log(`Validated ${qs.length} seed missions and hot-today performance build ${v.version}`);
          NODE
