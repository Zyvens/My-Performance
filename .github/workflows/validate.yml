name: Validate My Performance

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check production JavaScript syntax
        run: |
          for f in data.js routine-data.js app.js sp-clock-v6.js scheduler-core.js planner.js calendar-model-v3.js campaign-policy-v3.js calendar-model-fastpath-v4.js state-revision-prune-v8.js calendar-domain-v5.js calendar-revision-safety-v8.js calendar-groups-v7.js quest-audit-v6.js quest-milestones-v6.js quantitative-mainquests-v6.js calendar-persistence-v5.js calendar-planner-policy-v5.js planner-dependency-v5.js sidequest-quality-v5.js planner-engine-v5.js planner-group-integrity-v5.js routine-anchors-v7.js day-frame-v5.js day-frame-clock-v8.js wake-time-ui-v6.js opportunistic-sidequests-v5.js calendar-actions-v5.js calendar-runtime-v3.js cloud-sync-v2.js notifications.js pwa-update.js calendar-ui-v5.js temporal-execution-v8.js temporal-execution-ui-v8.js modal-ui-fix-v5.js mission-context-v5.js routine-side-policy-v7.js fragment-progress-v6.js weekly-config-ui-v7.js interactive-week-config-v8.js daily-review-v6.js calendar-advanced-v5.js calendar-dragdrop-v5.js calendar-strategic-v5.js retired-views-v6.js runtime-stability-v5.js sw.js; do node --check "$f"; done
      - name: Calendar functional regressions
        run: |
          node tests/calendar-v5-functional.test.js
          node tests/calendar-v5-routine-context.test.js
          node tests/opportunistic-sidequests.test.js
          node tests/modal-ui-v5.test.js
          node tests/calendar-v5-strategic.test.js
          node tests/quest-audit-v6.test.js
          node tests/daily-review-v6.test.js
          node tests/retired-views-v6.test.js
          node tests/wake-quantity-ui-v6.test.js
          node tests/weekly-config-v7.test.js
          node tests/interactive-week-config-v8.test.js
          node tests/temporal-execution-v8.test.js
          node tests/temporal-gap-boundary-v8.test.js
          node tests/revision-wake-safety-v8.test.js
      - name: Planner bounded-memory regression
        run: node --max-old-space-size=64 tests/planner-v5-stress.test.js
      - name: UI, cloud, PWA and production contracts
        run: |
          node tests/calendar-v5-ui-contract.test.js
          node tests/cloud-sync-v2.test.js
          node tests/pwa-runtime-refresh.test.js
          node tests/version-bump-policy.test.js
          node tests/production-runtime-contract.test.js
      - name: Validate catalog and runtime composition
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');const ctx={console};vm.createContext(ctx);vm.runInContext(fs.readFileSync('data.js','utf8'),ctx);vm.runInContext(fs.readFileSync('routine-data.js','utf8'),ctx);const qs=ctx.QUEST_SEED;if(!Array.isArray(qs)||qs.length<120)throw new Error(`Expected >=120 seed missions, got ${qs?.length}`);const ids=new Set();for(const q of qs){if(!q.id||!q.title)throw new Error('Mission without id/title');if(ids.has(q.id))throw new Error(`Duplicate mission id: ${q.id}`);ids.add(q.id)}
          const index=fs.readFileSync('index.html','utf8'),required=['sp-clock-v6.js','state-revision-prune-v8.js','calendar-domain-v5.js','calendar-revision-safety-v8.js','calendar-groups-v7.js','quest-audit-v6.js','quest-milestones-v6.js','quantitative-mainquests-v6.js','planner-engine-v5.js','planner-group-integrity-v5.js','routine-anchors-v7.js','day-frame-v5.js','day-frame-clock-v8.js','wake-time-ui-v6.js','opportunistic-sidequests-v5.js','calendar-ui-v5.js','temporal-execution-v8.js','temporal-execution-ui-v8.js','mission-context-v5.js','routine-side-policy-v7.js','fragment-progress-v6.js','weekly-config-ui-v7.js','interactive-week-config-v8.js','daily-review-v6.js','retired-views-v6.js'];for(const a of required)if(!index.includes(`<script src="${a}"></script>`))throw new Error(`Production asset missing: ${a}`);for(const old of ['routine.js','muay-optional.js','capacity-budget.js','scheduler-2.js','time-aware-capacity.js','late-wake-policy.js','schedule-authority.js'])if(index.includes(`<script src="${old}"></script>`))throw new Error(`Obsolete runtime loaded: ${old}`);if(index.includes('data-view="agenda"')||index.includes('data-view="timeline"'))throw new Error('Retired Calendar/Gantt navigation still visible');if(index.indexOf('state-revision-prune-v8.js')>index.indexOf('calendar-domain-v5.js'))throw new Error('Revision pruning must run before Calendar Domain startup save');if(index.indexOf('calendar-domain-v5.js')>index.indexOf('calendar-revision-safety-v8.js'))throw new Error('Revision safety must wrap Calendar Domain before mutations');if(index.indexOf('day-frame-v5.js')>index.indexOf('day-frame-clock-v8.js')||index.indexOf('day-frame-clock-v8.js')>index.indexOf('wake-time-ui-v6.js'))throw new Error('Sao Paulo Day Frame authority must load before wake UI');if(index.indexOf('calendar-ui-v5.js')>index.indexOf('temporal-execution-v8.js'))throw new Error('Temporal execution must wrap Planner after Calendar UI is available');if(index.indexOf('weekly-config-ui-v7.js')>index.indexOf('interactive-week-config-v8.js'))throw new Error('Interactive weekly map must load after base weekly config');if(index.indexOf('temporal-execution-v8.js')>index.indexOf('daily-review-v6.js'))throw new Error('Daily review must capture temporal Planner semantics');const v=JSON.parse(fs.readFileSync('version.json','utf8'));if(v.version!=='2.4.3')throw new Error(`Expected 2.4.3, got ${v.version}`);console.log(`Validated ${qs.length} seed missions and interactive weekly config build ${v.version}`);
          NODE
