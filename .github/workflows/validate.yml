name: Validate My Performance

on:
  pull_request:
  push:
    branches: [main, agent/scheduler-v2]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for f in data.js routine-data.js app.js cloud-sync.js planner.js routine.js adaptive-engine.js scheduler-core.js scheduler-v2-state.js scheduler-v2-engine.js scheduler-v2-ui.js runtime-hooks.js notifications.js narrator.js narrator-scheduler.js pwa-enhancements.js sw.js; do
            node --check "$f"
          done
      - name: Scheduler 2.0 behavior tests
        run: node test/scheduler-v2.test.js
      - name: Validate application contracts
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const ctx={console};vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('data.js','utf8'),ctx);
          vm.runInContext(fs.readFileSync('routine-data.js','utf8'),ctx);
          const qs=ctx.QUEST_SEED;
          if(!Array.isArray(qs)||qs.length<120)throw new Error(`Expected >=120 base quests, got ${qs?.length}`);
          const ids=new Set();for(const q of qs){if(!q.id||!q.title)throw new Error('Quest without id/title');if(ids.has(q.id))throw new Error(`Duplicate quest id: ${q.id}`);ids.add(q.id)}
          const broken=[];for(const q of qs)for(const d of q.dependencies||[])if(!ids.has(d))broken.push(`${q.id} -> ${d}`);if(broken.length)throw new Error(`Broken dependencies: ${broken.join(', ')}`);
          const index=fs.readFileSync('index.html','utf8');
          for(const token of ['scheduler-core.js','scheduler-v2-state.js','scheduler-v2-engine.js','scheduler-v2-ui.js','narrator-scheduler.js','pwa-enhancements.js'])if(!index.includes(token))throw new Error(`Missing runtime: ${token}`);
          for(const legacy of ['day-controls.js','weekend-protection.js','capacity-budget.js','muay-optional.js'])if(index.includes(`<script src="${legacy}"></script>`))throw new Error(`Legacy planning layer still active: ${legacy}`);
          if(index.indexOf('scheduler-v2-engine.js')>index.indexOf('notifications.js'))throw new Error('Scheduler must load before notifications');
          const sv=[fs.readFileSync('scheduler-v2-state.js','utf8'),fs.readFileSync('scheduler-v2-engine.js','utf8'),fs.readFileSync('scheduler-v2-ui.js','utf8')].join('\n');
          for(const token of ['GSA_TARGET=480','BNI_WEEKLY=120','WORKOUT_WEEKLY=5','startTracking','pauseTracking','completeTracking','Excluir deste dia','Missão Especial · Revisão do dia','Quick Add','gsa-main-hacktown-2026','gsa-main-eva-launch','gsa-main-editais','sleepEmergency','weeklyMetrics'])if(!sv.includes(token))throw new Error(`Scheduler feature missing: ${token}`);
          const sync=fs.readFileSync('cloud-sync.js','utf8');for(const token of ['revision','CONFLITO ENTRE DISPOSITIVOS','resolveMerge','DEVICE_ID'])if(!sync.includes(token))throw new Error(`Sync conflict feature missing: ${token}`);
          const manifest=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));if(!manifest.icons.some(x=>x.sizes==='192x192')||!manifest.icons.some(x=>x.sizes==='512x512'))throw new Error('PNG PWA icons missing');
          const sw=fs.readFileSync('sw.js','utf8');if(!sw.includes("my-performance-v2.0.0")||!sw.includes('SKIP_WAITING'))throw new Error('PWA update flow missing');
          console.log(`Validated ${qs.length} base quests and Scheduler 2.0 contracts`);
          NODE
