name: Validate My Performance

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check production JavaScript syntax
        run: |
          node --check data.js
          node --check routine-data.js
          node --check app.js
          node --check scheduler-core.js
          node --check planner.js
          node --check calendar-model-v3.js
          node --check campaign-policy-v3.js
          node --check planner-engine-v3.js
          node --check calendar-runtime-v3.js
          node --check cloud-sync-v2.js
          node --check notifications.js
          node --check pwa-update.js
          node --check calendar-ui-v3.js
          node --check sw.js
      - name: Calendar-first behavioral tests
        run: |
          node tests/calendar-v3.test.js
          node tests/cloud-sync-v2.test.js
          node tests/pwa-runtime-refresh.test.js
          node tests/version-bump-policy.test.js
      - name: Validate mission catalog and runtime composition
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const ctx={console};vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('data.js','utf8'),ctx);
          vm.runInContext(fs.readFileSync('routine-data.js','utf8'),ctx);
          const qs=ctx.QUEST_SEED;
          if(!Array.isArray(qs)||qs.length<120)throw new Error(`Expected >=120 seed missions, got ${qs?.length}`);
          const ids=new Set();for(const q of qs){if(!q.id||!q.title)throw new Error('Mission without id/title');if(ids.has(q.id))throw new Error(`Duplicate mission id: ${q.id}`);ids.add(q.id)}
          const broken=[];for(const q of qs)for(const d of q.dependencies||[])if(!ids.has(d))broken.push(`${q.id} -> ${d}`);if(broken.length)throw new Error(`Broken dependencies: ${broken.join(', ')}`);
          const index=fs.readFileSync('index.html','utf8');
          const loaded=['data.js','routine-data.js','app.js','scheduler-core.js','planner.js','calendar-model-v3.js','campaign-policy-v3.js','planner-engine-v3.js','calendar-runtime-v3.js','cloud-sync-v2.js','notifications.js','pwa-update.js','calendar-ui-v3.js'];
          for(const asset of loaded)if(!index.includes(`<script src="${asset}"></script>`))throw new Error(`Production asset missing: ${asset}`);
          const forbidden=['routine.js','muay-optional.js','adaptive-engine.js','adaptive-fairness.js','runtime-hooks.js','day-controls.js','weekend-protection.js','capacity-budget.js','balanced-capacity.js','funding-strategy-2026.js','post-funding-rebalance.js','canonical-week-template.js','canonical-week-policy.js','scheduler-2.js','live-capacity.js','recalc-center-fix.js','time-aware-core.js','time-aware-capacity.js','late-wake-policy.js','discard-day.js','schedule-authority.js','weekly-schedule-v2.js'];
          for(const asset of forbidden)if(index.includes(`<script src="${asset}"></script>`))throw new Error(`Legacy scheduler still loaded: ${asset}`);
          if(index.lastIndexOf('calendar-ui-v3.js')<index.lastIndexOf('planner-engine-v3.js'))throw new Error('Calendar UI must render from Planner Engine V3');
          const model=fs.readFileSync('calendar-model-v3.js','utf8'),policy=fs.readFileSync('campaign-policy-v3.js','utf8'),engine=fs.readFileSync('planner-engine-v3.js','utf8'),ui=fs.readFileSync('calendar-ui-v3.js','utf8');
          for(const token of ['campaign-hacktown-2026','campaign-eva-launch','campaign-editais','delete state.routineSettings.gymStart','specialCommitment:true','immovable:true'])if(!model.includes(token))throw new Error(`Calendar model contract missing: ${token}`);
          if(!policy.includes("q.dueDate=''" )||!policy.includes('campaignContainer=true'))throw new Error('Generic Editais campaign must not carry a fictitious deadline');
          for(const token of ['function workItems','function allocate','function discardDay','function skipSlot','Main Quest ocupou Side Quest','window.MyPerformancePlannerEngine'])if(!engine.includes(token))throw new Error(`Planner engine contract missing: ${token}`);
          for(const token of ['Calendário semanal','Pacotes de Main Quests','Importar Campanha','Descartar dia','renderTodayV3','renderConfigV3'])if(!ui.includes(token))throw new Error(`Calendar UI contract missing: ${token}`);
          const version=JSON.parse(fs.readFileSync('version.json','utf8'));if(version.version!=='2.0.0')throw new Error('Expected v2.0.0');
          console.log(`Validated ${qs.length} missions and My Performance ${version.version} calendar runtime`);
          NODE
