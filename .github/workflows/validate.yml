name: Validate My Performance

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check production JavaScript syntax
        run: |
          node --check data.js
          node --check routine-data.js
          node --check app.js
          node --check scheduler-core.js
          node --check planner.js
          node --check calendar-model-v3.js
          node --check campaign-policy-v3.js
          node --check calendar-model-fastpath-v4.js
          node --check calendar-domain-v5.js
          node --check planner-engine-v5.js
          node --check calendar-runtime-v3.js
          node --check cloud-sync-v2.js
          node --check notifications.js
          node --check pwa-update.js
          node --check calendar-ui-v5.js
          node --check runtime-stability-v5.js
          node --check sw.js
      - name: Calendar V5 functional regression
        run: node tests/calendar-v5-functional.test.js
      - name: Planner V5 bounded memory and zero-write regression
        run: node --max-old-space-size=64 tests/planner-v5-stress.test.js
      - name: Calendar V5 visual and domain contract
        run: node tests/calendar-v5-ui-contract.test.js
      - name: Cloud PWA and production contracts
        run: |
          node tests/cloud-sync-v2.test.js
          node tests/pwa-runtime-refresh.test.js
          node tests/version-bump-policy.test.js
          node tests/production-runtime-contract.test.js
      - name: Validate mission catalog and single Planner runtime
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');const ctx={console};vm.createContext(ctx);vm.runInContext(fs.readFileSync('data.js','utf8'),ctx);vm.runInContext(fs.readFileSync('routine-data.js','utf8'),ctx);const qs=ctx.QUEST_SEED;if(!Array.isArray(qs)||qs.length<120)throw new Error(`Expected >=120 seed missions, got ${qs?.length}`);const ids=new Set();for(const q of qs){if(!q.id||!q.title)throw new Error('Mission without id/title');if(ids.has(q.id))throw new Error(`Duplicate mission id: ${q.id}`);ids.add(q.id)}
          const index=fs.readFileSync('index.html','utf8');for(const asset of ['calendar-model-v3.js','campaign-policy-v3.js','calendar-model-fastpath-v4.js','calendar-domain-v5.js','planner-engine-v5.js','calendar-runtime-v3.js','cloud-sync-v2.js','notifications.js','pwa-update.js','calendar-ui-v5.js','runtime-stability-v5.js'])if(!index.includes(`<script src="${asset}"></script>`))throw new Error(`Production asset missing: ${asset}`);for(const asset of ['planner-engine-v4.js','calendar-ui-v3.js','runtime-stability-v4.js','routine.js','muay-optional.js','capacity-budget.js','scheduler-2.js','time-aware-capacity.js','late-wake-policy.js','schedule-authority.js'])if(index.includes(`<script src="${asset}"></script>`))throw new Error(`Obsolete runtime loaded: ${asset}`);if(index.indexOf('calendar-domain-v5.js')>index.indexOf('planner-engine-v5.js'))throw new Error('Domain V5 must load before Planner V5');if(index.indexOf('planner-engine-v5.js')>index.indexOf('calendar-ui-v5.js'))throw new Error('Planner V5 must load before Calendar UI V5');const v=JSON.parse(fs.readFileSync('version.json','utf8'));if(v.version!=='2.1.0')throw new Error(`Expected 2.1.0, got ${v.version}`);console.log(`Validated ${qs.length} missions and Calendar V5 ${v.version}`);
          NODE
