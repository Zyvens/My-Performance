name: Validate My Performance

on:
  pull_request:
  push:
    branches: [agent/life-rpg, agent/notifications-routine, agent/muay-optional, agent/adaptive-life-engine, agent/day-skip-daily-balance, agent/weekend-protection, agent/capacity-budget-bni, agent/scheduler-2-complete]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check data.js
          node --check routine-data.js
          node --check app.js
          node --check scheduler-core.js
          node --check cloud-sync.js
          node --check planner.js
          node --check routine.js
          node --check muay-optional.js
          node --check adaptive-engine.js
          node --check runtime-hooks.js
          node --check notifications.js
          node --check narrator.js
          node --check day-controls.js
          node --check weekend-protection.js
          node --check capacity-budget.js
          node --check scheduler-2.js
          node --check sw.js
      - name: Scheduler 2.0 unit tests
        run: node tests/scheduler2.test.js
      - name: Validate quest catalog and scheduler contracts
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const ctx={console};vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('data.js','utf8'),ctx);
          vm.runInContext(fs.readFileSync('routine-data.js','utf8'),ctx);
          const qs=ctx.QUEST_SEED;
          if(!Array.isArray(qs)||qs.length<120)throw new Error(`Expected >=120 quests after routine layer, got ${qs?.length}`);
          const ids=new Set();for(const q of qs){if(!q.id||!q.title)throw new Error('Quest without id/title');if(ids.has(q.id))throw new Error(`Duplicate quest id: ${q.id}`);ids.add(q.id)}
          const broken=[];for(const q of qs)for(const d of q.dependencies||[])if(!ids.has(d))broken.push(`${q.id} -> ${d}`);if(broken.length)throw new Error(`Broken dependencies: ${broken.join(', ')}`);
          const required=['routine-water-am','routine-muay','routine-gsa-focus-pm','routine-hygiene-night'];for(const id of required)if(!ids.has(id))throw new Error(`Missing routine quest: ${id}`);
          const adaptive=fs.readFileSync('adaptive-engine.js','utf8');if(!adaptive.includes("SYSTEM_START='2026-08-10'"))throw new Error('Adaptive engine must start on 2026-08-10');
          const day=fs.readFileSync('day-controls.js','utf8');if(!day.includes("GSA:{title:'GSA — avanço mínimo diário'")||!day.includes("Estudos:{title:'Estudos — sessão mínima diária'"))throw new Error('Daily GSA/Study minimum missing');if(!day.includes('EXTRA_MIN=120')||!day.includes('MIN_SLEEP_HOURS=6'))throw new Error('6h emergency mode missing');
          const week=fs.readFileSync('weekend-protection.js','utf8');for(const token of ['Sexta encerra às 18:00','Sábado encerra às 12:00','Domingo pessoal: trabalho e estudo bloqueados'])if(!week.includes(token))throw new Error(`Weekend protection missing: ${token}`);
          const cap=fs.readFileSync('capacity-budget.js','utf8');for(const token of ['GSA_TARGET=480','WORKOUT_TARGET=5','gsa-bni-weekly','gsa-bni-organization','gsa-main-hacktown-2026','gsa-main-eva-launch','gsa-main-editais','commuteOutMin','commuteReturnMin'])if(!cap.includes(token))throw new Error(`Capacity rule missing: ${token}`);if(!cap.includes('p.wake=5*60')||!cap.includes('p.end=21*60'))throw new Error('Wednesday BNI wake/sleep window missing');
          const muay=fs.readFileSync('muay-optional.js','utf8');if(!muay.includes("const ALLOWED_DAYS=[1,5]")||!muay.includes("BNI fixo 06:00–11:00"))throw new Error('Muay/BNI collision guard missing');
          const s2=fs.readFileSync('scheduler-2.js','utf8');for(const token of ['setWakeNow','recalcWeek','objectiveDiagnosis','startTracking','weeklyQuota','openQuickAdd'])if(!s2.includes(token))throw new Error(`Scheduler 2.0 contract missing: ${token}`);
          const sync=fs.readFileSync('cloud-sync.js','utf8');if(!sync.includes('my-performance-sync-conflict')||!sync.includes('resolveConflict'))throw new Error('Conflict-safe sync missing');
          const index=fs.readFileSync('index.html','utf8');for(const asset of ['scheduler-core.js','scheduler-2.js','scheduler-2.css'])if(!index.includes(asset))throw new Error(`Missing Scheduler asset in index: ${asset}`);
          const sw=fs.readFileSync('sw.js','utf8');for(const asset of ['scheduler-core.js','scheduler-2.js','scheduler-2.css'])if(!sw.includes(asset))throw new Error(`Missing Scheduler asset in service worker: ${asset}`);
          console.log(`Validated ${qs.length} quests and Scheduler 2.0 contracts`);
          NODE
