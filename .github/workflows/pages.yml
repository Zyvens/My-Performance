name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate My Performance 2.1.0 Calendar V5 runtime
        run: |
          node --check app.js
          node --check scheduler-core.js
          node --check planner.js
          node --check calendar-model-v3.js
          node --check campaign-policy-v3.js
          node --check calendar-model-fastpath-v4.js
          node --check calendar-domain-v5.js
          node --check calendar-persistence-v5.js
          node --check calendar-planner-policy-v5.js
          node --check planner-engine-v5.js
          node --check calendar-actions-v5.js
          node --check calendar-runtime-v3.js
          node --check cloud-sync-v2.js
          node --check notifications.js
          node --check pwa-update.js
          node --check calendar-ui-v5.js
          node --check calendar-advanced-v5.js
          node --check calendar-dragdrop-v5.js
          node --check runtime-stability-v5.js
          node --check sw.js
          node tests/calendar-v5-functional.test.js
          node --max-old-space-size=64 tests/planner-v5-stress.test.js
          node tests/calendar-v5-ui-contract.test.js
          node tests/cloud-sync-v2.test.js
          node tests/pwa-runtime-refresh.test.js
          node tests/version-bump-policy.test.js
          node tests/production-runtime-contract.test.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
