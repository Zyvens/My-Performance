name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate production runtime
        run: |
          node --check app.js
          node --check scheduler-core.js
          node --check scheduler-2.js
          node --check cloud-sync-v2.js
          node --check weekly-schedule-v2.js
          node --check pwa-update.js
          node --check runtime-health.js
          node --check sw.js
          node tests/scheduler2.test.js
          node tests/adaptive-fairness.test.js
          node tests/weekly-schedule-v2.test.js
          node tests/cloud-sync-v2.test.js
          node tests/pwa-runtime-refresh.test.js
          node tests/version-bump-policy.test.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
